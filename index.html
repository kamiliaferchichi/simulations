<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Mes TP</title>
<style>
  :root{
    --bg:#10141c; --card:#192030; --line:#2a3550; --text:#e8ecf4; --muted:#93a0b8; --accent:#5ea8ff;
  }
  @media (prefers-color-scheme: light){
    :root{ --bg:#f3f5f9; --card:#fff; --line:#d5dbe7; --text:#141a26; --muted:#5b6780; --accent:#1f6fd6; }
  }
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--text);font-family:system-ui,"Segoe UI",Arial,sans-serif;line-height:1.5}
  main{max-width:960px;margin:0 auto;padding:64px 20px}
  h1{font-size:2.4rem;margin:0 0 6px}
  .sub{color:var(--muted);margin:0 0 36px;font-size:1.1rem}
  .grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:16px}
  a.card{display:block;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:22px;text-decoration:none;color:inherit}
  a.card:hover,a.card:focus-visible{border-color:var(--accent);outline:none}
  .tag{color:var(--accent);font-size:.85rem;font-weight:600}
  .name{font-size:1.25rem;font-weight:700;margin:4px 0}
  .desc{color:var(--muted)}
  .count{color:var(--muted);margin-top:32px}
</style>
</head>
<body>
<main>
  <h1>Mes TP</h1>
  <p class="sub">Cliquez sur un TP pour l’ouvrir.</p>
  <div class="grid" id="grid"></div>
  <p class="count" id="count"></p>
</main>
<script>
  // ✏️ MODIFIEZ SEULEMENT CETTE LISTE : une ligne par TP.
  // dossier: nom du dossier du TP (la page cherche toute seule HTML5/index.html puis index.html)
  // lien: lien direct (pour un PDF par exemple)
    const tps = [
    { titre: "TP1 : partie 1", desc: "Compte rendu (PDF)", lien: "tp1_partie_partie2/Compte%20Rendu%20tp1.pdf" },
    { titre: "TP1 : partie 2 (MPLS)", desc: "Compte rendu (PDF)", lien: "tp1_partie_partie2/Compte_rendu_TP1_MPLS_Partie2.pdf" },
    { titre: "Lab BGP", desc: "Protocole de routage BGP", dossier: "lab_bgp" },
    { titre: "Lab Redistribution", desc: "Redistribution de routes", dossier: "lab_redistribution" },
    { titre: "TP2", desc: "Travaux pratiques 2", dossier: "tp2" },
    { titre: "TP3", desc: "Travaux pratiques 3", dossier: "tp3" },
    { titre: "TP4 : IPsec", desc: "Configuration VPN IPsec", dossier: "tp4-ipsec" },
    { titre: "TP4 : GRE", desc: "Tunnel GRE", dossier: "tp4-gre" },
    { titre: "TP5 : FR basic", desc: "Travaux pratiques 5, niveau basic", dossier: "tp5-fr-basic" },
    { titre: "TP5 : FR advanced", desc: "Travaux pratiques 5, niveau advanced", dossier: "tp5-fr-advanced" }
  ];

  const grid = document.getElementById("grid");

  async function existe(url) {
    try {
      const r = await fetch(url, { method: "HEAD", cache: "no-store" });
      return r.ok;
    } catch (e) { return false; }
  }

  async function ouvrir(ev, tp) {
    if (!tp.dossier) return;            // lien direct : comportement normal
    ev.preventDefault();
    const essais = [tp.dossier + "/HTML5/index.html", tp.dossier + "/index.html"];
    for (const u of essais) {
      if (await existe(u)) { window.open(u, "_blank", "noopener"); return; }
    }
    alert("TP introuvable sur GitHub.\nDossier cherché : " + tp.dossier +
          "\nVérifiez que ce dossier existe (même nom, mêmes majuscules).");
  }

  tps.forEach((tp, i) => {
    const a = document.createElement("a");
    a.className = "card";
    a.href = tp.lien || (tp.dossier + "/HTML5/index.html");
    a.target = "_blank";
    a.rel = "noopener";
    a.addEventListener("click", (ev) => ouvrir(ev, tp));
    const tag = document.createElement("div"); tag.className = "tag"; tag.textContent = "TP " + (i + 1);
    const name = document.createElement("div"); name.className = "name"; name.textContent = tp.titre;
    const desc = document.createElement("div"); desc.className = "desc"; desc.textContent = tp.desc;
    a.append(tag, name, desc);
    grid.appendChild(a);
  });
  document.getElementById("count").textContent = tps.length + " TP disponibles";
</script>
</body>
</html>
